<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>HW1-Shravankumar-Nagarajan</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<h1>Blog Post Creator</h1>
<form id="blogForm" action="#" method="post">
    <div>
        <label for="title">Blog Title</label><br/>
        <input type="text" id="title" name="title" placeholder="Enter the title of your blog" required autofocus/>
    </div>
    <div>
        <label for="author">Author Name</label><br/>
        <input type="text" id="author" name="author" placeholder="Enter your name" required/>
    </div>
    <div>
        <label for="email">Email</label><br/>
        <input type="email" id="email" name="email" placeholder="Enter your email" required/>
    </div>
    <div>
        <label for="content">Content</label><br/>
        <textarea id="content" name="content" rows="8" placeholder="Write your content here..." required></textarea>
    </div>
    <div>
        <label for="category">Category</label><br/>
        <select id="category" name="category">
            <option value="Technology">Technology</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
        </select>
    </div>
    <div>
        <input type="checkbox" id="terms" name="terms"/>
        <label for="terms">I agree to the terms and conditions.</label>
    </div>
    <div>
        <button type="submit">Publish Blog</button>
    </div>
</form>
<h2>Published Blogs</h2>
<div id="publishedBlogs"></div>
<script src="js/script.js"></script>
</body>
</html>
